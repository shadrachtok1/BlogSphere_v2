<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Blogsphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0e10;--bg2:#111416;--bg3:#181c20;--bg4:#1e2328;
      --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--border3:rgba(255,255,255,.18);
      --text:#e6e2da;--text2:#8a8680;--text3:#4e4a46;
      --accent:#d4621a;--accent2:#e8844a;
      --green:#22c55e;
      --syne:'Syne',sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',monospace;
      --radius:7px;
    }
    html,body{
      height:100%;font-family:var(--syne);background:var(--bg);color:var(--text);
      -webkit-font-smoothing:antialiased;font-size:14px;
      display:flex;align-items:center;justify-content:center;
    }

    /* Background grid pattern */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:48px 48px;
      pointer-events:none;
    }

    .login-outer{
      width:100%;max-width:400px;padding:24px;
      position:relative;z-index:1;
    }

    /* Brand */
    .login-brand{
      display:flex;align-items:center;gap:10px;
      margin-bottom:36px;justify-content:center;
    }
    .brand-mark{
      width:36px;height:36px;background:var(--accent);border-radius:7px;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:16px;color:#fff;
    }
    .brand-name{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--text);}

    /* Card */
    .login-card{
      background:var(--bg2);border:1px solid var(--border2);border-radius:12px;
      padding:32px 28px;
      box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03);
    }
    .login-card h2{
      font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text);
    }
    .login-card p{
      font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.5;
    }

    /* Flash messages */
    .flash{
      display:flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:var(--radius);margin-bottom:20px;
      font-size:13px;border:1px solid transparent;
    }
    .flash.danger{background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.2);}
    .flash.success{background:rgba(34,197,94,.1);color:#4ade80;border-color:rgba(34,197,94,.2);}
    .flash svg{flex-shrink:0;}

    /* Form */
    .form-group{margin-bottom:18px;}
    .form-group label{
      display:block;font-size:10px;font-family:var(--mono);letter-spacing:1px;
      text-transform:uppercase;color:var(--text3);margin-bottom:7px;
    }
    .form-group input{
      width:100%;padding:10px 13px;
      background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);
      font-family:var(--syne);font-size:14px;color:var(--text);
      outline:none;transition:border-color .15s,box-shadow .15s;
    }
    .form-group input::placeholder{color:var(--text3);}
    .form-group input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(212,98,26,.12);
    }

    /* Submit */
    .btn-login{
      width:100%;padding:11px;border-radius:var(--radius);
      background:var(--accent);color:#fff;border:none;
      font-family:var(--syne);font-size:14px;font-weight:600;
      cursor:pointer;transition:background .15s,box-shadow .15s;
      display:flex;align-items:center;justify-content:center;gap:8px;
      margin-top:6px;
    }
    .btn-login:hover{background:#b8510f;box-shadow:0 4px 20px rgba(212,98,26,.35);}
    .btn-login:active{transform:scale(.99);}

    /* Footer link */
    .login-footer{
      text-align:center;margin-top:20px;
      font-size:12px;color:var(--text3);
    }
    .login-footer a{color:var(--text2);text-decoration:none;transition:color .15s;}
    .login-footer a:hover{color:var(--accent);}
  </style>
</head>
<body>
<div class="login-outer">

  <div class="login-brand">
    <div class="brand-mark">
      <img src="/static/logo.png" alt="BlogSphere" style="width:22px;height:22px;object-fit:contain;filter:brightness(10);">
    </div>
    <div class="brand-name">Blogsphere</div>
  </div>

  <div class="login-card">
    <h2>Welcome back</h2>
    <p>Sign in to manage your content and settings.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">
      {% if category == 'danger' %}
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      {% else %}
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      {% endif %}
      {{ message }}
    </div>
    {% endfor %}
    {% endwith %}

    <form method="post" autocomplete="on">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn-login">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Sign in
      </button>
    </form>
  </div>

  <div class="login-footer">
    <a href="/" target="_blank">← Back to site</a>
  </div>

</div>
</body>
</html>
