<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — School Fee &amp; Records Management (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1526'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23C9A24B' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --navy:#14213D;
  --navy-deep:#0B1526;
  --navy-soft:#1E2F52;
  --gold:#C9A24B;
  --gold-soft:#E8D6A8;
  --paper:#F6F7F9;
  --card:#FFFFFF;
  --ink:#111827;
  --slate:#5B6472;
  --slate-light:#8A93A3;
  --line:#E3E6EC;
  --green:#1E7A4C;
  --green-bg:#E7F3EC;
  --amber:#9A6B14;
  --amber-bg:#FBF0DA;
  --red:#B3261E;
  --red-bg:#FBEAE9;
  --blue:#2A5DB0;
  --blue-bg:#E9EFFB;
  --shadow: 0 1px 2px rgba(20,33,61,0.04), 0 4px 16px rgba(20,33,61,0.06);
  --shadow-lg: 0 8px 30px rgba(20,33,61,0.14);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Fraunces',serif; letter-spacing:-0.01em; }
.mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:-0.01em; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input,select{ font-family:inherit; font-size:14px; }
::selection{ background:var(--gold-soft); }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--navy); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}
#app{ min-height:100vh; color:var(--ink); }

/* ===================== UTILITY ===================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 18px; border-radius:8px; font-weight:600; font-size:14px;
  transition:all .15s ease; white-space:nowrap;
}
.btn-primary{ background:var(--navy); color:#fff; }
.btn-primary:hover{ background:var(--navy-deep); }
.btn-gold{ background:var(--gold); color:var(--navy-deep); }
.btn-gold:hover{ background:#B8923D; }
.btn-ghost{ background:transparent; color:var(--navy); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--navy); }
.btn-text{ color:var(--slate); font-weight:500; }
.btn-text:hover{ color:var(--ink); }
.btn-sm{ padding:6px 12px; font-size:12.5px; }
.btn-xs{ padding:5px 10px; font-size:11.5px; }
.btn-danger{ background:var(--red-bg); color:var(--red); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-block{ width:100%; }
.btn-icon{ width:34px; height:34px; padding:0; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--slate); position:relative; }
.btn-icon:hover{ background:var(--paper); color:var(--ink); }

.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
.field input, .field select{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
}
.field input:disabled, .field select:disabled{ background:var(--paper); color:var(--slate); }
.field input:focus, .field select:focus{ border-color:var(--navy); outline:none; }
.field-error{ color:var(--red); font-size:12.5px; margin-top:6px; }
.hint{ color:var(--slate-light); font-size:12.5px; }

/* status pills */
.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
.pill-unpaid{ background:var(--red-bg); color:var(--red); }
.pill-partial{ background:var(--amber-bg); color:var(--amber); }
.pill-approved{ background:var(--green-bg); color:var(--green); }

.stamp{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 12px 3px 8px; border-radius:999px;
  border:1.5px solid var(--green); color:var(--green);
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  transform:rotate(-2deg);
  position:relative;
}
.stamp::before{ content:''; width:6px; height:6px; border-radius:50%; border:1.5px solid var(--green); }

/* type / category tags (Tuition Fee vs Other Charges) */
.tag{ display:inline-block; padding:3px 10px; border-radius:6px; font-size:11.5px; font-weight:600; }
.tag-tuition{ background:var(--blue-bg); color:var(--blue); }
.tag-other{ background:var(--paper); color:var(--slate); border:1px solid var(--line); }

/* ===================== LANDING ===================== */
.landing-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 48px; border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--navy); }
.brand-mark{ width:30px; height:30px; border-radius:7px; background:var(--navy); color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; font-family:'Fraunces',serif; }
.demo-badge{ background:var(--navy); color:var(--gold-soft); font-size:11px; font-weight:700; padding:4px 10px; border-radius:5px; letter-spacing:.06em; text-transform:uppercase; margin-left:10px; }

.hero{ padding:80px 48px 56px; max-width:1180px; margin:0 auto; }
.hero-grid{ display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center; }
.hero-eyebrow{ color:var(--gold); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:16px; }
.hero h1{ font-size:42px; line-height:1.14; font-weight:600; color:var(--navy-deep); margin:0 0 20px; }
.hero p{ font-size:17px; line-height:1.6; color:var(--slate); margin:0 0 32px; max-width:480px; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }

.mockup{ background:var(--navy-deep); border-radius:16px; padding:14px; box-shadow:var(--shadow-lg); }
.mockup-bar{ display:flex; gap:6px; padding:0 6px 12px; }
.mockup-dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); }
.mockup-screen{ background:var(--paper); border-radius:9px; overflow:hidden; padding:18px; }
.mockup-screen .mini-card{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
.mockup-row{ display:flex; justify-content:space-between; align-items:center; font-size:12px; }
.mockup-title{ font-family:'Fraunces',serif; font-size:14px; color:var(--navy); margin-bottom:10px; font-weight:600; }

.features{ background:var(--card); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:52px 48px; }
.features-grid{ max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:28px; }
.feature h3{ font-size:15.5px; margin:0 0 8px; color:var(--navy-deep); font-weight:600; }
.feature p{ font-size:13.5px; color:var(--slate); line-height:1.55; margin:0; }
.feature-num{ font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:12px; font-weight:600; margin-bottom:10px; display:block; }

.entry{ max-width:1180px; margin:0 auto; padding:60px 48px 84px; }
.entry h2{ font-size:26px; color:var(--navy-deep); margin:0 0 8px; }
.entry > p{ color:var(--slate); margin:0 0 32px; font-size:15px; }
.entry-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.entry-card{ padding:28px; }
.entry-card .icon-badge{ width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
.entry-card h3{ font-size:18px; margin:0 0 6px; color:var(--navy-deep); }
.entry-card p{ font-size:14px; color:var(--slate); margin:0 0 18px; line-height:1.5; }
.demo-creds{ background:var(--paper); border:1px dashed var(--line); border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; }
.demo-creds div{ display:flex; justify-content:space-between; padding:2px 0; }
.demo-creds .k{ color:var(--slate-light); }
.demo-creds .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--navy); }

footer.landing-footer{ text-align:center; padding:28px; color:var(--slate-light); font-size:12.5px; border-top:1px solid var(--line); }

/* ===================== APP SHELL (admin + portal) ===================== */
.shell{ display:flex; min-height:100vh; }
.sidebar{ width:250px; background:var(--navy-deep); color:#fff; flex-shrink:0; display:flex; flex-direction:column; padding:20px 14px; overflow-y:auto; }
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:0 10px 16px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
.sidebar-brand .brand-mark{ background:var(--gold); color:var(--navy-deep); }
.session-badge{ margin:0 10px 16px; background:rgba(201,162,75,.16); border:1px solid rgba(201,162,75,.35); color:var(--gold-soft); text-align:center; font-size:11.5px; font-weight:700; letter-spacing:.05em; padding:7px 8px; border-radius:7px; text-transform:uppercase; }
.side-context{ padding:0 10px 18px; }
.side-context .name{ font-size:13.5px; font-weight:600; color:#fff; }
.side-context .sub{ font-size:12px; color:rgba(255,255,255,.5); margin-top:2px; }
.nav-link{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:7px; color:rgba(255,255,255,.65); font-size:14px; font-weight:500; margin-bottom:2px; cursor:pointer; }
.nav-link:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav-link.active{ background:var(--gold); color:var(--navy-deep); font-weight:700; }
.nav-link svg{ flex-shrink:0; }
.nav-group-head{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:7px; color:rgba(255,255,255,.65); font-size:14px; font-weight:500; cursor:pointer; margin-bottom:2px; }
.nav-group-head:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav-group-head .chev{ margin-left:auto; transition:transform .15s ease; opacity:.6; }
.nav-group-head.open .chev{ transform:rotate(180deg); }
.nav-group-head.has-active{ color:#fff; }
.nav-children{ padding-left:30px; margin-bottom:4px; }
.nav-children .nav-link{ font-size:13.5px; padding:8px 10px; }
.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.1); }

.main{ flex:1; min-width:0; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 32px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.topbar h1{ font-size:20px; margin:0; color:var(--navy-deep); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar-right{ display:flex; align-items:center; gap:6px; position:relative; flex-shrink:1; min-width:0; justify-content:flex-end; }
.topbar-actions{ display:flex; align-items:center; gap:6px; margin-right:8px; padding-right:14px; border-right:1px solid var(--line); }
.badge-dot{ position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid #fff; }
.user-chip{ display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:999px; cursor:pointer; }
.user-chip:hover{ background:var(--paper); }
.user-avatar-sm{ width:30px; height:30px; border-radius:50%; background:var(--navy); color:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'Fraunces',serif; flex-shrink:0; }
.user-chip .uname{ font-size:13px; font-weight:600; color:var(--ink); }
.dropdown{ position:absolute; top:44px; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-lg); min-width:230px; z-index:40; overflow:hidden; }
.dropdown-item{ padding:11px 16px; font-size:13.5px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:9px; }
.dropdown-item:hover{ background:var(--paper); }
.dropdown-head{ padding:12px 16px; border-bottom:1px solid var(--line); }
.dropdown-head .t{ font-size:13px; font-weight:600; }
.dropdown-head .s{ font-size:11.5px; color:var(--slate-light); margin-top:1px; }
.notif-dropdown{ width:320px; }

.content{ padding:26px 32px 60px; max-width:1180px; }

.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.stat-card{ padding:18px 20px; display:flex; gap:14px; align-items:flex-start; }
.stat-icon{ width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-label{ font-size:11.5px; color:var(--slate-light); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:5px; }
.stat-value{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--navy-deep); line-height:1.2; }

.quick-actions{ display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 26px; }
.quick-action{ display:flex; align-items:center; gap:8px; padding:11px 16px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-weight:600; color:var(--navy-deep); cursor:pointer; }
.quick-action:hover{ border-color:var(--navy); }
.quick-action svg{ color:var(--gold); }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
thead th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); font-weight:700; padding:12px 16px; background:var(--paper); border-bottom:1px solid var(--line); }
tbody td{ padding:13px 16px; border-bottom:1px solid var(--line); }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:#FAFBFC; }
.table-wrap{ overflow-x:auto; }

.section-head{ display:flex; align-items:center; justify-content:space-between; margin:32px 0 14px; gap:12px; flex-wrap:wrap; }
.section-head:first-child{ margin-top:0; }
.section-head h2{ font-size:17px; margin:0; color:var(--navy-deep); }

.empty{ text-align:center; padding:48px 20px; color:var(--slate-light); font-size:14px; }

/* session tabs */
.session-tabs{ display:flex; gap:24px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.session-tab{ padding:10px 2px 12px; font-size:13.5px; font-weight:600; color:var(--slate-light); border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
.session-tab:hover{ color:var(--ink); }
.session-tab.active{ color:var(--navy-deep); border-color:var(--gold); }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:rgba(11,21,38,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeIn .15s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:#fff; border-radius:12px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:modalIn .18s ease; }
@keyframes modalIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line); }
.modal-head h3{ font-size:17px; margin:0; color:var(--navy-deep); }
.modal-body{ padding:22px; }
.modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
.close-x{ color:var(--slate-light); font-size:20px; line-height:1; padding:4px; cursor:pointer; }
.close-x:hover{ color:var(--ink); }

/* side panel (Remita-style generate RRR) */
.panel-backdrop{ position:fixed; inset:0; background:rgba(11,21,38,.45); z-index:100; animation:fadeIn .15s ease; }
.side-panel{ position:fixed; top:0; right:0; height:100vh; width:100%; max-width:440px; background:#fff; box-shadow:var(--shadow-lg); z-index:101; display:flex; flex-direction:column; animation:panelIn .2s ease; }
@keyframes panelIn{ from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.panel-head{ padding:22px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
.panel-head h3{ font-size:17px; margin:0; color:var(--navy-deep); }
.panel-body{ padding:24px; overflow-y:auto; flex:1; }
.panel-foot{ padding:18px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; }

.readonly-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
.readonly-row:last-child{ border-bottom:none; }
.readonly-row .k{ color:var(--slate-light); }
.readonly-row .v{ font-weight:600; color:var(--ink); text-align:right; }

.pay-for-opt{ border:1.5px solid var(--line); border-radius:9px; padding:13px 14px; margin-bottom:10px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
.pay-for-opt.active{ border-color:var(--navy); background:var(--paper); }
.pay-for-opt input{ margin-top:3px; }
.pay-for-opt .lbl{ font-weight:600; font-size:13.5px; color:var(--ink); }
.pay-for-opt .sub{ font-size:12px; color:var(--slate-light); margin-top:2px; }

/* toast */
#toast-wrap{ position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{ background:var(--navy-deep); color:#fff; padding:12px 18px; border-radius:8px; font-size:13.5px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastIn .18s ease; max-width:340px; }
@keyframes toastIn{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
.toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0; }

/* auth screens */
.auth-split{ min-height:100vh; display:flex; }
.auth-visual{ flex:1 1 44%; background:linear-gradient(165deg,var(--navy-deep) 0%,var(--navy) 100%); color:#fff; padding:60px 56px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden; }
.auth-visual::before{ content:''; position:absolute; inset:0; background-image:radial-gradient(circle at 88% 12%, rgba(201,162,75,.20), transparent 45%), radial-gradient(circle at 8% 92%, rgba(201,162,75,.14), transparent 42%); pointer-events:none; }
.auth-visual::after{ content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size:34px 34px; pointer-events:none; }
.auth-visual-inner{ position:relative; z-index:1; max-width:420px; }
.auth-crest{ width:60px; height:60px; border-radius:50%; border:1.5px solid rgba(201,162,75,.55); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--gold); margin-bottom:26px; background:rgba(201,162,75,.08); }
.auth-visual h1{ font-size:27px; color:#fff; margin:0 0 6px; font-weight:600; line-height:1.25; }
.auth-visual .tagline{ color:var(--gold-soft); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; margin-bottom:34px; }
.auth-divider{ width:38px; height:2px; background:var(--gold); margin-bottom:30px; }
.auth-statement{ margin-bottom:26px; }
.auth-statement .label{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.auth-statement .label::before{ content:''; width:14px; height:1.5px; background:var(--gold); display:inline-block; }
.auth-statement p{ font-size:14.5px; line-height:1.72; color:rgba(255,255,255,.72); margin:0; }
.auth-visual-foot{ margin-top:38px; display:flex; gap:32px; padding-top:28px; border-top:1px solid rgba(255,255,255,.12); }
.auth-visual-foot .stat .n{ font-family:'Fraunces',serif; font-size:19px; color:#fff; font-weight:600; line-height:1; }
.auth-visual-foot .stat .l{ font-size:10.5px; color:rgba(255,255,255,.48); text-transform:uppercase; letter-spacing:.05em; margin-top:6px; }

.auth-form-side{ flex:1 1 56%; display:flex; align-items:center; justify-content:center; padding:40px; background:#fff; }
.auth-form-wrap{ width:100%; max-width:372px; }
.auth-form-wrap .brand-sm{ display:flex; align-items:center; gap:9px; margin-bottom:44px; font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--navy); }

<div id="toast-wrap"></div>

<script>
/* ================================================================
   LEDGER — DEMO PROTOTYPE for Primary & Secondary Schools
   Single-file, self-contained, in-memory (persisted to localStorage
   so a page refresh mid-pitch doesn't lose state). No server, no
   real payments, no real SMS — every "sent"/"paid" action is
   simulated and logged so you can show exactly what a parent or
   admin would see.
================================================================= */

const HOSTEL_FEE = 80000;
const PTA_DUES = 10000;

function buildSeed(){
  const sessions = ['2025/2026','2024/2025','2023/2024'];
  const current = sessions[0];

  function feesAcrossSessions(base){
    // base: array of {label,type,amount} for the current session.
    // Earlier sessions scale down slightly, mimicking annual fee increases.
    const out = {};
    sessions.forEach((s,i)=>{
      const factor = i===0?1: i===1?0.9: 0.82;
      out[s] = base.map((it,ix)=>({ id:'f'+s.replace('/','')+ix, label:it.label, type:it.type, amount: Math.round((it.amount*factor)/500)*500 }));
    });
    return out;
  }

  const classes = [
    { id:'c1', name:'Primary 5', section:'Primary', fees: feesAcrossSessions([
      {label:'Tuition Fee', type:'Tuition', amount:120000},
      {label:'Feeding', type:'Other', amount:35000},
      {label:'Books & Materials', type:'Other', amount:18000},
      {label:'ICT & Library Services', type:'Other', amount:15000},
      {label:'Sports & Games', type:'Other', amount:8000},
    ])},
    { id:'c2', name:'JSS 1', section:'Junior Secondary', fees: feesAcrossSessions([
      {label:'Tuition Fee', type:'Tuition', amount:180000},
      {label:'Examination Fees', type:'Other', amount:15000},
      {label:'ICT Services', type:'Other', amount:20000},
      {label:'Library Services', type:'Other', amount:10000},
      {label:'Books & Materials', type:'Other', amount:22000},
      {label:'Sports & Games', type:'Other', amount:10000},
    ])},
    { id:'c3', name:'JSS 2', section:'Junior Secondary', fees: feesAcrossSessions([
      {label:'Tuition Fee', type:'Tuition', amount:185000},
      {label:'Examination Fees', type:'Other', amount:15000},
      {label:'ICT Services', type:'Other', amount:20000},
      {label:'Library Services', type:'Other', amount:10000},
      {label:'Books & Materials', type:'Other', amount:23000},
      {label:'Sports & Games', type:'Other', amount:10000},
    ])},
    { id:'c4', name:'SSS 3', section:'Senior Secondary', fees: feesAcrossSessions([
      {label:'Tuition Fee', type:'Tuition', amount:240000},
      {label:'Examination & WAEC/NECO Fees', type:'Other', amount:65000},
      {label:'Laboratory & Studio Charges', type:'Other', amount:30000},
      {label:'ICT Services', type:'Other', amount:20000},
      {label:'Library Services', type:'Other', amount:12000},
      {label:'Career Counselling', type:'Other', amount:8000},
    ])},
  ];

  const students = [
    { id:'s1', fullName:'Amaka Eze', admissionNo:'GIS/25/0142', gender:'Female', parentName:'Mrs. Chidinma Eze', parentPhone:'0803 214 7765', email:'amaka.eze@parent.example', classId:'c2', username:'amaka.eze', password:'demo123', boarding:false, academicClearance:'Cleared', waiver:null },
    { id:'s6', fullName:'Kelechi Eze', admissionNo:'GIS/25/0201', gender:'Male', parentName:'Mrs. Chidinma Eze', parentPhone:'0803 214 7765', email:'amaka.eze@parent.example', classId:'c1', username:'kelechi.eze', password:'demo123', boarding:false, academicClearance:'Cleared', waiver:{ type:'percent', value:10, reason:'Sibling Discount' } },
    { id:'s2', fullName:'Tobenna Okafor', admissionNo:'GIS/25/0143', gender:'Male', parentName:'Mr. Emeka Okafor', parentPhone:'0806 552 3319', email:'tobenna.okafor@parent.example', classId:'c2', username:'tobenna.okafor', password:'demo123', boarding:true, academicClearance:'Cleared', waiver:null },
    { id:'s3', fullName:'Fatima Bello', admissionNo:'GIS/24/0098', gender:'Female', parentName:'Alhaji Musa Bello', parentPhone:'0812 908 4471', email:'fatima.bello@parent.example', classId:'c3', username:'fatima.bello', password:'demo123', boarding:false, academicClearance:'Cleared', waiver:null },
    { id:'s4', fullName:'David Adeyemi', admissionNo:'GIS/23/0061', gender:'Male', parentName:'Mrs. Folake Adeyemi', parentPhone:'0705 331 6620', email:'david.adeyemi@parent.example', classId:'c4', username:'david.adeyemi', password:'demo123', boarding:false, academicClearance:'Pending', waiver:null },
    { id:'s5', fullName:'Chiamaka Nwosu', admissionNo:'GIS/25/0177', gender:'Female', parentName:'Mr. Ifeanyi Nwosu', parentPhone:'0701 442 9903', email:'chiamaka.nwosu@parent.example', classId:'c1', username:'chiamaka.nwosu', password:'demo123', boarding:false, academicClearance:'Cleared', waiver:null },
  ];

  function classFeeTotal(cls, session){ return cls.fees[session].reduce((s,i)=>s+i.amount,0); }
  function feeAmountFor(student, session){
    const cls = classes.find(c=>c.id===student.classId);
    let t = classFeeTotal(cls, session);
    if(student.boarding) t += Math.round(HOSTEL_FEE*(session===current?1:session===sessions[1]?0.9:0.82)/500)*500;
    if(student.waiver && student.waiver.value){
      const off = student.waiver.type==='percent' ? Math.round(t*(student.waiver.value/100)) : Math.min(student.waiver.value, t);
      t = Math.max(0, t - off);
    }
    return t;
  }

/* ---------------- CSV helpers ---------------- */
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0) return [];
  return lines.map(line=>{
    const cells = [];
    let cur='', inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQuotes){
        if(ch==='"' && line[i+1]==='"'){ cur+='"'; i++; }
        else if(ch==='"'){ inQuotes=false; }
        else cur+=ch;
      } else {
        if(ch==='"') inQuotes=true;
        else if(ch===','){ cells.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}

const ADMIN_TITLES = { dashboard:'Dashboard', classes:'Fee Structure', invoices:'Invoices', onlinelog:'Payments Log', students:'Students', hostel:'Hostel Management', settings:'Notification Settings' };
const PORTAL_TITLES = { overview:'Dashboard', schedule:'Payment Schedule', payments:'My Payments', online:'Online Payments', results:'Academic Results', hostel:'Hostel Reservation' };
function updateTitle(){
  let t = 'Ledger — School Fee & Records Management';
  if(ui.view==='admin-login') t = 'Admin sign in · Ledger';
  else if(ui.view==='portal-login') t = 'Sign in · Ledger';
  else if(ui.view.startsWith('admin-')) t = (ADMIN_TITLES[ui.adminTab]||'Admin') + ' · Ledger Admin';
  else if(ui.view.startsWith('portal-')) t = (PORTAL_TITLES[ui.portalTab]||'Portal') + ' · Ledger';
  document.title = t;
}

function render(){
  if(!ui.booted){ bootApp(); return; }
  const app = document.getElementById('app');
  if(ui.view==='landing') app.innerHTML = renderLanding();
  else if(ui.view==='admin-login') app.innerHTML = renderAdminLogin();
  else if(ui.view==='portal-login') app.innerHTML = renderPortalLogin();
  else if(ui.view.startsWith('admin-')) app.innerHTML = renderAdminShell();
  else if(ui.view.startsWith('portal-')) app.innerHTML = renderPortalShell();
  else app.innerHTML = renderLanding();

  const isShell = ui.view.startsWith('admin-')||ui.view.startsWith('portal-');
  app.className = (ui.theme==='dark' && isShell) ? 'dark' : '';

  updateTitle();
  if(ui.modal) renderModal();
  if(ui.panel) renderPanel();
  window.scrollTo(0,0);
  document.addEventListener('click', onDocClick, true);
}
function onDocClick(e){
  if(!e.target.closest('.user-chip') && !e.target.closest('.dropdown')){ if(ui.userMenuOpen){ ui.userMenuOpen=false; document.querySelectorAll('.dropdown.user-dd').forEach(d=>d.remove()); } }
  if(!e.target.closest('.notif-btn') && !e.target.closest('.notif-dropdown')){ if(ui.notifOpen){ ui.notifOpen=false; document.querySelectorAll('.dropdown.notif-dropdown').forEach(d=>d.remove()); } }
}
function toggleTheme(){ ui.theme = ui.theme==='dark'?'light':'dark'; render(); }
function toggleMobileNav(){ ui.mobileNavOpen = !ui.mobileNavOpen; render(); }
function closeMobileNav(){ if(ui.mobileNavOpen){ ui.mobileNavOpen = false; } }
function toggleUserMenu(e){ e.stopPropagation(); ui.userMenuOpen=!ui.userMenuOpen; ui.notifOpen=false; render(); }
function toggleNotif(e){ e.stopPropagation(); ui.notifOpen=!ui.notifOpen; ui.userMenuOpen=false; render(); }

function pricingTierRate(n){ if(n<=200) return 450; if(n<=500) return 350; return 280; }
function pricingOutputMarkup(n){
  const rate = pricingTierRate(n);
  const perTerm = n*rate;
  const perSession = perTerm*3;
  return `
    <div class="summary-box" style="padding:0;">
      <div class="row"><span class="hint">Rate per student / term</span><span><b>${naira(rate)}</b></span></div>
      <div class="row"><span class="hint">Estimated cost / term (${n} students)</span><span><b>${naira(perTerm)}</b></span></div>
      <div class="row total"><span>Estimated cost / session (3 terms)</span><span>${naira(perSession)}</span></div>
    </div>
  `;
}
function updatePricingEstimate(){
  const n = Math.max(1, Number(document.getElementById('pricing-count').value)||0);
  document.getElementById('pricing-output').innerHTML = pricingOutputMarkup(n);
}

================================================================= */
function renderNav(items, activeTab, openState, setTabFn, toggleGroupFn){
  return items.map(it=>{
    if(it.type==='link'){
      return `<div class="nav-link ${activeTab===it.tab?'active':''}" onclick="${setTabFn}('${it.tab}')">${it.icon}${it.label}</div>`;
    }
    const childActive = it.children.some(c=>c.tab===activeTab);
    const isOpen = !!openState[it.key] || childActive;
    return `
      <div class="nav-group-head ${isOpen?'open':''} ${childActive?'has-active':''}" onclick="${toggleGroupFn}('${it.key}')">
        ${it.icon}${it.label}<span class="chev">${ICONS.chevDown}</span>
      </div>
      ${isOpen? `<div class="nav-children">${it.children.map(c=>`<div class="nav-link ${activeTab===c.tab?'active':''}" onclick="${setTabFn}('${c.tab}')">${c.label}</div>`).join('')}</div>` : ''}
    `;
  }).join('');
}

function renderTopbar(title, opts){
  opts = opts||{};
  const notifList = opts.notifications || [];
  const unread = notifList.length;
  return `
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;min-width:0;">
      <button class="btn-icon hamburger-btn" onclick="toggleMobileNav()" title="Menu" aria-label="Open menu">${ICONS.menu}</button>
      <h1>${title}</h1>

    <div class="topbar-right">

        <button class="btn-icon notif-btn" onclick="toggleNotif(event)" title="Notifications" aria-label="Notifications" aria-haspopup="true">${ICONS.bell}${unread?'<span class="badge-dot"></span>':''}</button>
        <button class="btn-icon" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">${ui.theme==='dark'?ICONS.sun:ICONS.moon}</button>
      </div>
      <div class="user-chip" onclick="toggleUserMenu(event)" role="button" tabindex="0" aria-haspopup="true" aria-label="Account menu">
        <div class="user-avatar-sm">${opts.avatarInitials}</div>
        <span class="uname">${opts.userName}</span>
        ${ICONS.chevDown}
      </div>
      ${ui.notifOpen? renderNotifDropdown(notifList) : ''}

function renderNotifDropdown(list){
  return `<div class="dropdown notif-dropdown" role="menu">

function renderUserDropdown(opts){
  const siblings = opts.siblings || [];
  return `<div class="dropdown user-dd" role="menu">
    <div class="dropdown-head"><div class="t">${opts.userName}</div><div class="s">${opts.userSub||''}</div></div>
    ${siblings.length? `

    `:''}
    <div class="dropdown-item" onclick="go('landing')" role="menuitem">${ICONS.logout} Log out</div>
  </div>`;
}
function switchChild(studentId){
  ui.currentStudentId = studentId;

function submitBulkImportResults(){
  const text = document.getElementById('bir-text').value;
  const term = ui.modal.term || ui.resultTerm || 'First Term';
  const rows = parseCSV(text);
  if(rows.length<2){ toast('Paste CSV data with a header row plus at least one result row'); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = { admissionNo: header.indexOf('admissionno'), subject: header.indexOf('subject'), ca1: header.indexOf('ca1'), ca2: header.indexOf('ca2'), exam: header.indexOf('exam') };
  if(idx.admissionNo<0 || idx.subject<0){ toast('Missing required columns: admissionNo, subject'); return; }
  let updated=0; const errors=[];
  rows.slice(1).forEach((row,i)=>{
    const admissionNo = (row[idx.admissionNo]||'').trim();
    const subject = (row[idx.subject]||'').trim();
    const st = state.students.find(s=>s.admissionNo.toLowerCase()===admissionNo.toLowerCase());
    if(!st){ errors.push(`Row ${i+2}: admission no. "${admissionNo}" not found`); return; }
    const validSubjects = subjectsForClass(classById(st.classId));
    if(!validSubjects.includes(subject)){ errors.push(`Row ${i+2}: subject "${subject}" not valid for this student's class`); return; }
    const row2 = ensureResultRow(st.id, term, subject);
    row2.ca1 = Math.max(0, Math.min(20, Number(row[idx.ca1])||0));
    row2.ca2 = Math.max(0, Math.min(20, Number(row[idx.ca2])||0));
    row2.exam = Math.max(0, Math.min(60, Number(row[idx.exam])||0));
    row2.total = row2.ca1 + row2.ca2 + row2.exam;
    row2.grade = gradeFor(row2.total);
    updated++;
  });
  saveState(); closeModal();
  if(errors.length) toast(`${updated} result(s) saved, ${errors.length} row(s) had issues`);
  else toast(`${updated} result(s) saved for ${term}`);
  render();
}

function pushReminder(inv){
  if(!state.school.notifSettings.feeReminder) return false;
  const st = studentById(inv.studentId);
  const balance = inv.amount - inv.paid;
  state.notifications.unshift({ id:uid('n'), to:st.parentPhone, body:`Reminder: ${st.fullName}'s ${inv.session} balance of ${naira(balance)} is still due.`, time:'just now' });
  return true;
}

/* ---- Bulk CSV import ---- */
function openBulkImportModal(){
  ui.modal = { type:'bulk-import', text:'', result:null };
  render();
}
function submitBulkImport(){
  const text = document.getElementById('bi-text').value;
  const rows = parseCSV(text);
  if(rows.length<2){ toast('Paste CSV data with a header row plus at least one student'); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    fullName: header.indexOf('fullname'), gender: header.indexOf('gender'), className: header.indexOf('class'),
    parentName: header.indexOf('parentname'), parentPhone: header.indexOf('parentphone'), email: header.indexOf('email'), boarding: header.indexOf('boarding'),
  };
  if(idx.fullName<0 || idx.className<0 || idx.parentPhone<0){ toast('Missing required columns: fullName, class, parentPhone'); return; }
  let created=0; const errors=[]; const newStudents=[];
  rows.slice(1).forEach((row,i)=>{
    const fullName = (row[idx.fullName]||'').trim();
    const className = (row[idx.className]||'').trim();
    if(!fullName || !className){ errors.push(`Row ${i+2}: missing name or class`); return; }
    const cls = state.classes.find(c=>c.name.toLowerCase()===className.toLowerCase());
    if(!cls){ errors.push(`Row ${i+2}: class "${className}" not found`); return; }
    const gender = idx.gender>=0 ? (row[idx.gender]||'Male').trim() : 'Male';
    const parentName = idx.parentName>=0 ? (row[idx.parentName]||'').trim() : '';
    const parentPhone = (row[idx.parentPhone]||'').trim();
    const email = idx.email>=0 ? (row[idx.email]||'').trim() : '';
    const boarding = idx.boarding>=0 ? /^y|true/i.test(row[idx.boarding]||'') : false;
    const username = slugify(fullName) + (state.students.some(s=>s.username===slugify(fullName)) ? Math.floor(Math.random()*90+10) : '');
    const password = genPassword();
    const student = { id:uid('s'), fullName, admissionNo:genAdmissionNo(), gender, parentName, parentPhone, email, classId:cls.id, username, password, boarding, academicClearance:'Pending', waiver:null };
    state.students.push(student);
    const amount = recalcInvoiceAmount(student, state.school.currentSession);
    state.invoices.push({ id:uid('i'), studentId:student.id, session:state.school.currentSession, dueDate: state.invoices[0]?.dueDate || '2026-09-14', amount, paid:0, status:'UNPAID' });
    newStudents.push(student);
    created++;
  });
  saveState();
  ui.modal = { type:'bulk-import-result', created, errors, newStudents };
  render();
}

  const rows = [['Full Name','Username','Password','Admission No.']];

    state.notifications.unshift({ id:uid('n'), to:st.parentPhone, body:`Payment of ${naira(amount)} received for ${st.fullName} (${inv.session}). New balance: ${naira(inv.amount-inv.paid)}.`, time:'just now' });

function submitGenerateInvoices(){
  const session = document.getElementById('gi-session').value.trim();
  const due = document.getElementById('gi-due').value;
  if(!session || !due){ toast('Fill in session and due date'); return; }
  let created=0, skipped=0;
  state.students.forEach(st=>{
    if(invoiceFor(st.id, session)){ skipped++; return; }
    const amount = recalcInvoiceAmount(st, session);
    state.invoices.push({ id:uid('i'), studentId:st.id, session, dueDate:due, amount, paid:0, status:'UNPAID' });
    created++;
    if(state.school.notifSettings.invoiceGenerated){
      state.notifications.unshift({ id:uid('n'), to:st.parentPhone, body:`A new ${session} invoice of ${naira(amount)} has been generated for ${st.fullName}, due ${fmtDate(due)}.`, time:'just now' });
    }
  });
  if(!state.school.sessions.includes(session)) state.school.sessions.unshift(session);
  saveState(); closeModal();
  toast(`${created} invoice(s) created${skipped?`, ${skipped} already existed`:''}`);
  ui.adminTab='invoices'; ui.adminSession=session; render();
}

function closeModal(){ ui.modal=null; render(); }
function renderModal(){
  const app = document.getElementById('app');
  const wrap = document.createElement('div');
  wrap.className='modal-backdrop';
  wrap.setAttribute('role','presentation');
  wrap.onclick = (e)=>{ if(e.target===wrap) closeModal(); };
  wrap.innerHTML = modalContent();
  const inner = wrap.querySelector('.modal');
  if(inner){ inner.setAttribute('role','dialog'); inner.setAttribute('aria-modal','true'); }
  app.appendChild(wrap);
}

function renderCalendar(dueDates){
  const now = ui.calMonth || new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const monthName = first.toLocaleDateString('en-NG',{month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isDue = dueDates.includes(dstr);
    const isToday = dstr===todayStr;
    cells += `<div class="cal-day ${isDue?'due':''} ${isToday && !isDue?'today':''}">${d}</div>`;
  }
  return `
    <div class="cal-head"><span class="cal-title">${monthName}</span><span class="hint">Payment schedule</span></div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${dueDates.length? `<p class="hint" style="margin-top:10px;">🔴 marks a fee due date</p>`:''}
  `;
}

function sessionTabsMarkup(active, setterFn){
  return `<div class="session-tabs">${state.school.sessions.map(s=>`<div class="session-tab ${active===s?'active':''}" onclick="${setterFn}('${s}')">${s}</div>`).join('')}</div>`;
}

/* ---- Payment Schedule ---- */
function portalSchedule(student, cls){
  ui.portalSession = ui.portalSession || state.school.currentSession;
  const sess = ui.portalSession;
  const clsLabel = classLabelForSession(student, sess);
  let items = classFeeItems(cls, sess).slice();
  if(student.boarding) items = items.concat([{id:'hostel', label:'Hostel Accommodation', type:'Other', amount: Math.round(HOSTEL_FEE*(sess===state.school.currentSession?1:0.88)/500)*500}]);
  const gross = items.reduce((s,i)=>s+i.amount,0);
  const waiver = waiverAmount(student, gross);
  const total = gross - waiver;
  return `
    <div class="card" style="padding:20px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div class="stat-label">${sess===state.school.currentSession?'Current Session':sess+' Session'} Total Payable</div>
      <div class="stat-value" style="font-size:22px;color:var(--gold);">${naira(total)}</div>
    </div>
    ${sessionTabsMarkup(sess, 'setPortalSession')}
    <div class="card">
      <div style="padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
        <div><b>${sess} Academic Session</b><div class="hint">${clsLabel.name} · ${clsLabel.section}</div></div>
        <div class="hint">Total: <b style="color:var(--ink);">${naira(total)}</b></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Fee Item</th><th>Type</th><th>Class</th><th>Amount</th></tr></thead>
        <tbody>${items.map(it=>`<tr>
          <td>${it.label}</td>
          <td><span class="tag ${it.type==='Tuition'?'tag-tuition':'tag-other'}">${it.type==='Tuition'?'Tuition Fee':'Other Charges'}</span></td>
          <td>${clsLabel.name}</td>
          <td>${naira(it.amount)}</td>
        </tr>`).join('')}
        ${waiver>0?`<tr><td colspan="3" style="color:var(--green);">Less: ${student.waiver.reason||'Discount'} ${student.waiver.type==='percent'?'('+student.waiver.value+'%)':''}</td><td style="color:var(--green);">-${naira(waiver)}</td></tr>`:''}
        </tbody>
      </table></div>
    </div>
  `;
}
function setPortalSession(s){ ui.portalSession=s; render(); }

/* ---- My Payments ---- */
function portalPayments(student, cls){
  ui.portalSession = ui.portalSession || state.school.currentSession;
  const sess = ui.portalSession;
  const inv = invoiceFor(student.id, sess);
  const history = paymentsForStudent(student.id, sess);
  const grandTotal = state.payments.filter(p=>p.studentId===student.id).reduce((s,p)=>s+p.amount,0);
  return `
    <div class="grid-3">
      <div class="card stat-card"><div class="stat-icon" style="background:var(--green-bg);color:var(--green);">${ICONS.check}</div><div><div class="stat-label">Total Paid</div><div class="stat-value" style="color:var(--green);">${naira(inv?inv.paid:0)}</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:var(--blue-bg);color:var(--blue);">${ICONS.card}</div><div><div class="stat-label">Total Payable</div><div class="stat-value">${naira(inv?inv.amount:0)}</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:var(--red-bg);color:var(--red);">${ICONS.bell}</div><div><div class="stat-label">Balance</div><div class="stat-value" style="color:var(--red);">${naira(inv?inv.amount-inv.paid:0)}</div></div></div>
    </div>
    ${sessionTabsMarkup(sess, 'setPortalSession')}
    <div class="card table-wrap">
      <div style="padding:14px 20px;text-align:right;border-bottom:1px solid var(--line);" class="hint">Total: <b style="color:var(--ink);">${naira(history.reduce((s,p)=>s+p.amount,0))}</b></div>
      ${history.length===0? '<div class="empty">No payments recorded for this session yet.</div>' : `
      <table><thead><tr><th>Type</th><th>Amount</th><th>RRR</th><th>Order #</th><th>Date</th><th>Source</th><th></th></tr></thead>
      <tbody>${history.map(p=>`<tr>
        <td>${p.type}</td><td>${naira(p.amount)}</td>
        <td class="mono hint">${p.rrr}</td><td class="mono hint">${p.orderRef}</td>
        <td>${fmtDate(p.date)}</td>
        <td>${p.online?'Remita':'Bursar'}</td>
        <td style="text-align:right;"><button class="btn btn-text btn-sm" onclick="openReceipt('${p.id}')" aria-label="View receipt">${ICONS.printer} Receipt</button></td>
      </tr>`).join('')}</tbody></table>`}
      <div style="padding:14px 20px;text-align:right;border-top:1px solid var(--line);" class="hint">Grand Total (All Sessions): <b style="color:var(--ink);">${naira(grandTotal)}</b></div>
    </div>

    <div class="card summary-box" style="margin-top:20px;">
      <div class="row"><span class="hint">Full Fee Due</span><span>${naira(inv?inv.amount:0)}</span></div>
      <div class="row total"><span>Total Paid</span><span style="color:var(--green);">${naira(inv?inv.paid:0)}</span></div>
    </div>
  `;
}

/* ---- Online Payments (RRR ledger + generate) ---- */
function portalOnline(student, cls){
  const rows = state.payments.filter(p=>p.studentId===student.id && p.online).sort((a,b)=>a.date<b.date?1:-1);
  return `
    <div class="section-head"><h2>Online Payments</h2><button class="btn btn-gold btn-sm" onclick="openGenerateRRR('${student.id}')">${ICONS.arrow} Generate RRR</button></div>
    <div class="card table-wrap">
      ${rows.length===0? '<div class="empty">No RRR transactions yet. Click "Generate RRR" to make a payment.</div>' : `
      <table><thead><tr><th>RRR #</th><th>Order #</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr></thead>
      <tbody>${rows.map(p=>`<tr>
        <td class="mono">${p.rrr}</td><td class="mono hint">${p.orderRef}</td>
        <td>${p.type}</td><td>${naira(p.amount)}</td>
        <td><span class="pill pill-approved">Approved</span></td>
        <td>${fmtDate(p.date)}</td>
        <td style="text-align:right;"><button class="btn-icon" onclick="openReceipt('${p.id}')" aria-label="View receipt" title="View receipt">${ICONS.dots}</button></td>
      </tr>`).join('')}</tbody></table>`}
    </div>
  `;
}
function openGenerateRRR(studentId){
  ui.panel = { type:'generate-rrr', studentId, payFor:'balance', customAmount:'' };
  render();
}
function setPayFor(mode){ ui.panel.payFor = mode; render(); }
function closePanel(){ ui.panel=null; render(); }
function renderPanel(){
  const app = document.getElementById('app');
  const back = document.createElement('div');
  back.className='panel-backdrop';
  back.setAttribute('role','presentation');
  back.onclick = closePanel;
  app.appendChild(back);
  const wrap = document.createElement('div');
  wrap.innerHTML = panelContent();
  const panelEl = wrap.firstElementChild;
  if(panelEl){ panelEl.setAttribute('role','dialog'); panelEl.setAttribute('aria-modal','true'); panelEl.setAttribute('aria-label','Generate Remita transaction'); }
  app.appendChild(panelEl);
}
function panelContent(){
  const p = ui.panel;
  if(p.type==='generate-rrr'){
    const st = studentById(p.studentId);
    const cls = classById(st.classId);
    const sess = state.school.currentSession;
    const inv = invoiceFor(st.id, sess);
    const balance = inv ? inv.amount-inv.paid : 0;
    const custom = Number(p.customAmount)||0;
    return `
    <div class="side-panel" onclick="event.stopPropagation()">
      <div class="panel-head"><h3>Generate Remita Transaction</h3><span class="close-x" onclick="closePanel()" role="button" tabindex="0" aria-label="Close">${ICONS.x}</span></div>
      <div class="panel-body">
        <div class="readonly-row"><span class="k">Admission No.</span><span class="v">${st.admissionNo}</span></div>
        <div class="readonly-row"><span class="k">Name</span><span class="v">${st.fullName}</span></div>
        <div class="readonly-row"><span class="k">Class</span><span class="v">${cls.name}</span></div>
        <div class="readonly-row"><span class="k">Section</span><span class="v">${cls.section}</span></div>
        <div class="readonly-row"><span class="k">Email</span><span class="v">${st.email}</span></div>
        <div class="readonly-row"><span class="k">Phone</span><span class="v">${st.parentPhone}</span></div>

        <div style="margin-top:20px;margin-bottom:10px;font-size:12.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;">Payment For</div>

        <label class="pay-for-opt ${p.payFor==='balance'?'active':''}">
          <input type="radio" name="payfor" ${p.payFor==='balance'?'checked':''} onclick="setPayFor('balance')">
          <div><div class="lbl">${naira(balance)} (100% School Fee Balance)</div></div>
        </label>
        <label class="pay-for-opt ${p.payFor==='dues'?'active':''}">
          <input type="radio" name="payfor" ${p.payFor==='dues'?'checked':''} onclick="setPayFor('dues')">
          <div><div class="lbl">${naira(PTA_DUES)} (PTA / Development Levy)</div></div>
        </label>
        <label class="pay-for-opt ${p.payFor==='any'?'active':''}">
          <input type="radio" name="payfor" ${p.payFor==='any'?'checked':''} onclick="setPayFor('any')">
          <div><div class="lbl">Any Amount</div><div class="sub" style="color:var(--red);">Use only for part payment of fees</div></div>
        </label>
        ${p.payFor==='any' ? `<div class="field" style="margin-top:8px;"><input type="number" placeholder="Enter amount in naira" value="${p.customAmount}" oninput="ui.panel.customAmount=this.value" max="${balance}"></div>` : ''}
      </div>
      <div class="panel-foot">
        <button class="btn btn-ghost" onclick="closePanel()">Close</button>
        <button class="btn btn-gold" style="flex:1;" onclick="submitGenerateRRR()">${ICONS.arrow} Generate RRR</button>
      </div>
    </div>`;
  }
  return '';
}
function submitGenerateRRR(){
  const p = ui.panel;
  const st = studentById(p.studentId);
  const sess = state.school.currentSession;
  const inv = invoiceFor(st.id, sess);
  const balance = inv.amount-inv.paid;
  let amount, type, affectsInvoice=true;
  if(p.payFor==='balance'){ amount = balance; type = 'Tuition Fee + Other Charges'; }
  else if(p.payFor==='dues'){ amount = PTA_DUES; type = 'PTA / Development Levy'; affectsInvoice=false; }
  else { amount = Number(p.customAmount)||0; type = 'Tuition Fee + Other Charges (Part Payment)'; }
  if(p.payFor!=='dues' && (amount<=0 || amount>balance)){ toast('Enter a valid amount up to '+naira(balance)); return; }
  if(amount<=0){ toast('Enter a valid amount'); return; }
  closePanel();
  ui.modal = { type:'pay-processing' }; render();
  setTimeout(()=>{
    const rrr = genRRR(), orderRef = genOrderRef();
    if(affectsInvoice){ inv.paid += amount; inv.status = inv.paid>=inv.amount?'PAID':'PARTIAL'; }
    const payment = { id:uid('p'), studentId:st.id, session:sess, type, amount, rrr, orderRef, date:new Date().toISOString().slice(0,10), source:'Remita Online', online:true };
    state.payments.push(payment);
    if(state.school.notifSettings.paymentReceived){
      state.notifications.unshift({ id:uid('n'), to:st.parentPhone, body:`Payment of ${naira(amount)} received for ${st.fullName} (${sess}). RRR ${rrr}.`, time:'just now' });
    }
    saveState();
    ui.modal = { type:'pay-success', amount, rrr, paymentId:payment.id };
    render();
  }, 1300);
}

/* ---- Academic Results ---- */
function portalResults(student, cls){
  const term = ui.resultTerm;
  const published = isResultsPublished(student.classId, term);
  const termSelect = `<select style="width:auto;padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;" onchange="setResultTerm(this.value)">
        ${TERMS.map(t=>`<option ${term===t?'selected':''}>${t}</option>`).join('')}
      </select>`;
  if(!published){
    return `
    <div class="section-head"><h2>Academic Results</h2>${termSelect}</div>
    <div class="card" style="padding:44px 24px;text-align:center;">
      <div style="width:48px;height:48px;border-radius:50%;background:var(--amber-bg);color:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">${ICONS.calendar}</div>
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--navy-deep);margin-bottom:6px;">Results not yet published</div>
      <p class="hint" style="max-width:360px;margin:0 auto;">${cls.name}'s ${term} results for ${state.school.currentSession} haven't been published by the school yet. Check back soon.</p>
    </div>`;
  }
  const rows = (state.results[student.id] && state.results[student.id][term]) || [];
  const avg = rows.length ? Math.round(rows.reduce((s,r)=>s+r.total,0)/rows.length) : 0;
  return `
    <div class="section-head">
      <h2>Academic Results</h2>
      ${termSelect}
    </div>
    <div class="info-banner">${ICONS.book} <span>${student.fullName} · ${cls.name} · ${term}, ${state.school.currentSession} Session. Results are provisional pending final academic clearance.</span></div>
    ${rows.length===0? '<div class="card empty">No results entered for this term yet.</div>' : `
    <div class="card table-wrap">
      <table><thead><tr><th>Subject</th><th>CA1 (20)</th><th>CA2 (20)</th><th>Exam (60)</th><th>Total (100)</th><th>Grade</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${r.subject}</b></td><td>${r.ca1}</td><td>${r.ca2}</td><td>${r.exam}</td><td><b>${r.total}</b></td>
        <td><span class="grade-${r.grade==='A'?'a':r.grade==='B'?'b':(r.grade==='C'||r.grade==='D')?'c':'f'}">${r.grade}</span></td>
      </tr>`).join('')}</tbody></table>
    </div>
    <div class="card summary-box" style="margin-top:18px;"><div class="row total"><span>Term Average</span><span>${avg}%</span></div></div>
    `}
  `;
}
function setResultTerm(t){ ui.resultTerm=t; render(); }

/* ---- Hostel Reservation ---- */
function portalHostel(student, cls){
  if(student.boarding){
    const roomNo = 100 + (student.id.charCodeAt(1)%20);
    const block = ['Falcon House','Eagle House','Heron House'][student.id.charCodeAt(1)%3];
    return `
      <div class="info-banner" style="background:var(--green-bg);color:var(--green);">${ICONS.check} <span>You have a confirmed hostel space for the ${state.school.currentSession} session. The accommodation fee is included in your fee schedule.</span></div>
      <div class="grid-2">
        <div class="card" style="padding:22px;">
          <div class="stat-label">Hostel Block</div><div class="stat-value" style="margin-bottom:16px;">${block}</div>
          <div class="detail-row"><span class="k">Room number</span><span class="v">${roomNo}</span></div>
          <div class="detail-row"><span class="k">Bed space</span><span class="v">${(student.id.charCodeAt(1)%4)+1}</span></div>
          <div class="detail-row"><span class="k">Accommodation fee</span><span class="v">${naira(HOSTEL_FEE)}</span></div>
        </div>
        <div class="card" style="padding:22px;">
          <div class="stat-label" style="margin-bottom:12px;">Amenities included</div>
          ${['Furnished bunk & wardrobe','3 meals daily','24/7 house parent supervision','Laundry service','Wi-Fi study room'].map(a=>`<div class="fee-row"><span>${ICONS.check} ${a}</span></div>`).join('')}
        </div>
      </div>
      <button class="btn btn-ghost" style="margin-top:20px;" onclick="requestVacate('${student.id}')">Request to vacate hostel</button>
    `;
  }
  return `
    <div class="info-banner">${ICONS.bed} <span>You're currently registered as a day student. Reserve a hostel space below — the accommodation fee (${naira(HOSTEL_FEE)}) will be added to your ${state.school.currentSession} fee schedule.</span></div>
    <div class="card" style="padding:26px;max-width:460px;">
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:6px;color:var(--navy-deep);">Reserve a hostel space</div>
      <p class="hint" style="margin-bottom:18px;">${state.school.capacity - state.students.filter(s=>s.boarding).length} space(s) available for ${state.school.currentSession}.</p>
      <div class="fee-row"><span>Accommodation fee</span><span>${naira(HOSTEL_FEE)}</span></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="requestReserve('${student.id}')">Reserve Hostel</button>
    </div>
  `;
}
function requestReserve(studentId){
  const st = studentById(studentId);
  st.boarding = true;
  syncStudentInvoice(st, state.school.currentSession);
  if(state.school.notifSettings.hostelReserved){
    state.notifications.unshift({ id:uid('n'), to:st.parentPhone, body:`${st.fullName} reserved a hostel space for ${state.school.currentSession}. Accommodation fee added to fee schedule.`, time:'just now' });
  }
  saveState();
  toast('Hostel space reserved — fee added to your schedule');
  render();
}
function requestVacate(studentId){
  const st = studentById(studentId);
  st.boarding = false;
  syncStudentInvoice(st, state.school.currentSession);
  saveState();
  toast('Hostel reservation removed');
  render();
}

/* ---------------- init ---------------- */
function openEditProfileModal(studentId){ ui.modal = { type:'edit-profile', student: studentById(studentId) }; render(); }
window.__debug = { get state(){ return state; }, get ui(){ return ui; } };
function bootApp(){
  document.getElementById('app').innerHTML = `<div class="app-loader"><div class="mark">L</div><div class="spin"></div></div>`;
  setTimeout(()=>{ ui.booted = true; render(); }, 550);
}
bootApp();</script>
